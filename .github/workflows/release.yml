name: Release

# 推送版本标签时：构建单文件 → 跑无头自检 → 把 exe 挂到该标签的 Release 页
# 说明：仓库正文不放二进制，程序本体只在 Releases 页面提供。
on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布到的标签（同名 Release 的附件会被覆盖）'
        required: true

permissions:
  contents: write   # 创建/更新 Release 与上传附件所需

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 单文件 + 自包含 + 裁剪（不开 R2R：开了 SDK 会丢弃 exe 里的图标资源）
      - name: Publish
        run: >
          dotnet publish MiniLaunch/MiniLaunch.csproj
          -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:PublishTrimmed=true
          -o out

      # 无头自检必须全绿（退出码 0），否则不发版
      # 注意：MiniLaunch.exe 是 WinExe（GUI 子系统），PowerShell 直接调用**不会等待**进程结束，
      # $LASTEXITCODE 会是 $null → 必须用 Start-Process -Wait -PassThru 取真实退出码。
      - name: Self-test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\out\MiniLaunch.exe" -ArgumentList "--selftest" `
                -Wait -PassThru -NoNewWindow -RedirectStandardOutput "selftest.log"
          Get-Content "selftest.log" | Select-Object -Last 5
          if ($p.ExitCode -ne 0) { throw "自检未通过（退出码 $($p.ExitCode)），终止发布" }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path out\MiniLaunch.exe -DestinationPath "dist\MiniLaunch-$env:RELEASE_TAG-win-x64.zip" -Force
          "MiniLaunch $env:RELEASE_TAG（单文件免安装；解压后双击 MiniLaunch.exe 运行）" | Out-File dist\VERSION.txt -Encoding utf8
          Get-ChildItem dist | Select-Object Name, Length

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: MiniLaunch ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          body: |
            Windows 极简启动器，单文件免安装（自包含 + 裁剪，约 11.8 MB）。

            - `MiniLaunch.exe`：直接双击运行，无需安装 .NET
            - `MiniLaunch-<版本>-win-x64.zip`：同上打包

            若 Windows 弹出「已保护你的电脑」蓝色窗口，点 **更多信息 → 仍要运行** 即可。
          files: |
            out/MiniLaunch.exe
            dist/MiniLaunch-${{ env.RELEASE_TAG }}-win-x64.zip
            dist/VERSION.txt
